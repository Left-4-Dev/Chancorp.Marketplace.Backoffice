<div class="dashboard">
  <div class="dashboard-header">
    <h2>Dashboard</h2>
    <p>Bienvenido al panel de administración de Chancorp Marketplace</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats" [style.--accent-color]="stat.color">
      <div class="stat-icon">
        <span class="material-icons">{{ stat.icon }}</span>
      </div>
      <div class="stat-info">
        <span class="stat-value">{{ stat.value }}</span>
        <span class="stat-title">{{ stat.title }}</span>
      </div>
    </div>
  </div>

  <div class="quick-actions">
    <h3>Acciones Rápidas</h3>
    <div class="actions-grid">
      <a routerLink="/categories" class="action-card">
        <span class="material-icons">add_circle</span>
        <span>Nueva Categoría</span>
      </a>
      <a routerLink="/subcategories" class="action-card">
        <span class="material-icons">add_circle</span>
        <span>Nueva Subcategoría</span>
      </a>
      <a routerLink="/products" class="action-card">
        <span class="material-icons">add_circle</span>
        <span>Nuevo Producto</span>
      </a>
    </div>
  </div>
</div>
